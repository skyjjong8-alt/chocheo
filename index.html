<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>처처 모임장부</title>
  <meta name="description" content="처처 모임 통합 장부">
  <meta name="theme-color" content="#f4f3ec">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="처처장부">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #f4f3ec; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
    /* 노치/홈바 영역은 비워두고, 그 안쪽을 장부 앱이 꽉 채움 */
    #app {
      position: fixed; border: 0; background: #f4f3ec;
      top: env(safe-area-inset-top); bottom: env(safe-area-inset-bottom);
      left: env(safe-area-inset-left); right: env(safe-area-inset-right);
      width: calc(100% - env(safe-area-inset-left) - env(safe-area-inset-right));
      height: calc(100% - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }
    #splash {
      position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; background: #f4f3ec;
      transition: opacity .35s;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(43,85,119,.18); }
    #splash p { margin: 0; color: #2b5577; font-weight: 700; font-size: 15px; }
    .dots span { display: inline-block; width: 7px; height: 7px; margin: 0 3px; border-radius: 50%; background: #2f8c86; animation: b 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 0%, 80%, 100% { transform: scale(.5); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
    #offline { display: none; color: #e04848; font-size: 13px; }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-192.png" alt="처처">
    <p>처처 모임장부</p>
    <div class="dots"><span></span><span></span><span></span></div>
    <div id="offline">인터넷 연결을 확인해주세요.</div>
  </div>

  <!-- ▼ 구글 앱스스크립트 웹앱 주소 (재배포로 주소가 바뀌면 여기만 고치면 됩니다) -->
  <iframe id="app" title="처처 모임장부"
          src="https://script.google.com/macros/s/AKfycbxR59gI8G6liiydMh3WODhPXnSTZto5giZf9W0GW0YdXVxDqOxvwuM1dGdtUVbCyaz4/exec"
          allow="clipboard-read; clipboard-write"></iframe>

  <script>
    var splash = document.getElementById('splash');
    function hideSplash() { splash.classList.add('hide'); }
    document.getElementById('app').addEventListener('load', function () { setTimeout(hideSplash, 250); });
    setTimeout(hideSplash, 12000); // 느린 네트워크 대비
    if (!navigator.onLine) document.getElementById('offline').style.display = 'block';
    window.addEventListener('online', function () { location.reload(); });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
